<!-- TODO: 登録失敗時の警告メッセージを表示-->
<div class="whole">
  <div class="content">
    <div class="quotation-container">
      <div style="display:flex; align-items: center;">
        <mat-icon fontIcon="arrow_back" class="return-icon" (click)="return()"></mat-icon>
        <h2>見積書の新規作成</h2>
      </div>
      <div>
        <!-- 基本情報 -->
        <section class="section">
          <h3>基本情報</h3>
          <div class="form-grid">
            <div class="form-group">
              <label>見積番号</label>
              <input type="text" [(ngModel)]="quotationID">
            </div>
            <div class="form-group">
              <label>見積元</label>
              <select [(ngModel)]="quotationType">
                <option value="1">自社</option>
                <option value="2">他社</option>
              </select>
            </div>
            <div class="form-group">
              <label>見積日</label>
              <input type="date" [(ngModel)]="quotationDate" (change)="updateValidDate()">
            </div>
            <div class="form-group">
              <label>有効期限</label>
              <input type="date" [(ngModel)]="validDate">
            </div>
          </div>
        </section>

        <!-- 取引先情報 -->
        <section class="section">
          <h3>取引先情報</h3>
          <div class="form-grid">
            <div class="form-group">
              <label>取引先番号</label>
              <input type="text" [(ngModel)]="customerID"><mat-icon fontIcon="search" class="searchBut" title="検索"
                (click)="selectCustomer()"></mat-icon>
            </div>
            <div class="form-group">
              <label>取引先名</label>
              <input type="text" [(ngModel)]="customerName">
            </div>
            <div class="form-group">
              <label>略称</label>
              <input type="text" [(ngModel)]="customerNickname">
            </div>
            <div class="form-group">
              <label>責任者</label>
              <input type="text" [(ngModel)]="inResponse">
            </div>
            <div class="form-group">
              <label>担当者</label>
              <input type="text" [(ngModel)]="contactor">
            </div>
            <div class="form-group">
              <label>電話番号</label>
              <input type="text" [(ngModel)]="phone">
            </div>
            <div class="form-group">
              <label>携帯番号</label>
              <input type="text" [(ngModel)]="cellPhone">
            </div>
            <div class="form-group">
              <label>FAX番号</label>
              <input type="text" [(ngModel)]="faxNumber">
            </div>
            <div class="form-group">
              <label>法人番号</label>
              <input type="text" [(ngModel)]="taxNumber">
            </div>
            <div class="form-group">
              <label>所在地</label>
              <input type="text" [(ngModel)]="address">
            </div>
            <div class="form-group">
              <label>納品先住所</label>
              <input type="text" [(ngModel)]="shipAddress">
            </div>
            <div class="form-group">
              <label>請求先住所</label>
              <input type="text" [(ngModel)]="invoiceAddress">
            </div>
            <div class="form-group">
              <label>支払方法</label>
              <input type="text" [(ngModel)]="payBy">
            </div>
          </div>
        </section>

        <!-- 備考 -->
        <section class="section">
          <h3>備考</h3>
          <div class="form-grid">
            <div class="form-group full-width">
              <label>備考</label>
              <textarea rows="4" [(ngModel)]="remark" placeholder="必要に応じて備考を入力してください"></textarea>
            </div>
          </div>
        </section>

        <!-- 明細情報 -->
        <section class="section">
          <div class="detailSe"
            style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #4981cf;  margin-bottom: 20px;">
            <h3 style="margin: 1px; padding-bottom: 4px; border-bottom: none">見積明細</h3>
            <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="add" class="addButton"
              (click)="add()"></mat-icon>
          </div>

          <div style="overflow-x: auto;">
            <table class="detail-table" style="border-collapse: collapse; min-width: 1400px;">
              <thead style="background-color: #eaeff7;">
                <tr>
                  <th>#</th>
                  <th>明細番号</th>
                  <th>材料番号</th>
                  <th>加工種類</th>
                  <th>厚さ</th>
                  <th>幅</th>
                  <th>長さ</th>
                  <th>重量</th>
                  <th>直径</th>
                  <th>外径</th>
                  <th>内径</th>
                  <th>カットサイズ</th>
                  <th>表面処理</th>
                  <th>仕様</th>
                  <th>数量</th>
                  <th>単価</th>
                  <th>小計</th>
                  <th>操作</th>
                </tr>
              </thead>
              @for (item of infos; track $index) {
              <tbody>
                <tr>
                  <td>{{ $index + 1 }}</td>
                  <td><input type="text" [(ngModel)]="item.quotationDetailID"></td>
                  <td><input type="text" [(ngModel)]="item.materialID"></td>
                  <td>
                    <select [(ngModel)]="item.processingType" style="width:160px">
                      <option value=null disabled>加工種類を選択</option>
                      <option value="ステンレス板材">ステンレス板材</option>
                      <option value="ステンレス丸棒">ステンレス丸棒</option>
                      <option value="ステンレスパイプ">ステンレスパイプ</option>
                      <option value="ステンレス一枚切断">ステンレス一枚切断</option>
                      <option value="ステンレスアングル">ステンレスアングル</option>
                      <option value="ステンレスチャンネル">ステンレスチャンネル</option>
                    </select>
                  </td>
                  <td><input type="number" [(ngModel)]="item.thickness"
                      oninput="if(value < 0) value = 0; if(value % 1 !== 0) value = Math.round(value * 100) / 100;">
                  </td>
                  <td><input type="number" [(ngModel)]="item.width"
                      oninput="if(value < 0) value = 0; if(value % 1 !== 0) value = Math.round(value * 100) / 100;">
                  </td>
                  <td><input type="number" [(ngModel)]="item.length"
                      oninput="if(value < 0) value = 0; if(value % 1 !== 0) value = Math.round(value * 100) / 100;">
                  </td>
                  <td><input type="number" [(ngModel)]="item.weight"
                      oninput="if(value < 0) value = 0; if(value % 1 !== 0) value = Math.round(value * 100) / 100;">
                  </td>
                  <td><input type="number" [(ngModel)]="item.diameter"
                      oninput="if(value < 0) value = 0; if(value % 1 !== 0) value = Math.round(value * 100) / 100;">
                  </td>
                  <td><input type="number" [(ngModel)]="item.outerDiameter"
                      oninput="if(value < 0) value = 0; if(value % 1 !== 0) value = Math.round(value * 100) / 100;">
                  </td>
                  <td><input type="number" [(ngModel)]="item.innerThickness"
                      oninput="if(value < 0) value = 0; if(value % 1 !== 0) value = Math.round(value * 100) / 100;">
                  </td>
                  <td><input type="number" [(ngModel)]="item.cuttingSize"
                      oninput="if(value < 0) value = 0; if(value % 1 !== 0) value = Math.round(value * 100) / 100;">
                  </td>
                  <td><input type="text" [(ngModel)]="item.surfaceTreatment" style="width:160px"></td>
                  <td><input type="text" [(ngModel)]="item.specification" style="width:160px"></td>
                  <td><input type="number" [(ngModel)]="item.quantity" (ngModelChange)="updateSubtotal(item)"
                      oninput="if(value<0)value=0 ; if(value%1 !== 0)value= Math.round(value)"></td>
                  <td><input type="number" [(ngModel)]="item.unitPrice" (ngModelChange)="updateSubtotal(item)"
                      oninput="if(value < 0) value = 0; if(value % 1 !== 0) value = Math.round(value * 100) / 100;">
                  </td>
                  <td><input type="number" [(ngModel)]="item.subtotal" readonly></td>
                  <td><button type="button" (click)="delete($index)">削除</button></td>
                </tr>
              </tbody>
              }
            </table>
          </div>
        </section>



        <!-- 合計情報 -->
        <section class="section">
          <div class="totals" style="font-size: 18px; font-weight: bold;">
            <div>合計：¥{{ subTotal}}</div>
            <div>稅額：¥<input type="number" [(ngModel)]="tax" (ngModelChange)="updateTotalAmount()"
                oninput="if(value < 0) value = 0; if(value % 1 !== 0) value = Math.round(value * 100) / 100;"></div>
            <div>総額：¥{{ totalAmount}}</div>
          </div>
        </section>

        <hr style="margin: 40px 0; border: none; border-top: 2px dashed #ccc;">
        <div class="actions">
          <button type="button" (click)="return()">戻る</button>
          <button type="submit" (click)="send()">保存する</button>
        </div>
      </div>
    </div>
  </div>
</div>


 <!--固定表示ボタン-->
<div class="toBottom" (click)="toButtom()" [ngClass]="{'show': showButton, 'hidden': !showButton}">
  @if(isAtBottom()){
  <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="arrow_upward_alt" class="arrow"></mat-icon>
  }@else {
  <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="arrow_downward_alt" class="arrow"></mat-icon>
  }
</div>
