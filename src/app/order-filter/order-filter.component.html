<h2 mat-dialog-title class="title">搜尋篩選器
  <mat-icon aria-hidden="false" fontIcon="close" class="close" (click)="closeDialog()"></mat-icon>
</h2>

<mat-dialog-content class="dialog-content">
  <div class="filter-dialog">


    <div style="display: flex;">
      <!-- 訂單編號 -->
      <div class="form-group">
        <label for="orderID">訂單編號</label>
        <div class="text-inputs">
          <input type="text" id="orderID" placeholder="輸入編號" [(ngModel)]="orderID">
        </div>
      </div>



      <!-- 預估廢料編號 -->
      <div class="form-group" style="margin-left: -10px;">
        <label for="estID">預估廢料編號</label>
        <div class="text-inputs">
          <input type="text" id="estID" placeholder="輸入編號" [(ngModel)]="estScrapID">
        </div>
      </div>
    </div>

    <!-- 客戶編號 -->
    <div style="display: flex;">
      <div class="form-group">
        <label for="customerID">客戶編號</label>
        <div class="text-inputs">
          <input type="text" id="customerID" placeholder="輸入編號" [(ngModel)]="customerID">
        </div>
      </div>

      <div class="form-group" style="margin-left: -10px;">
        <label for="status">狀態</label>
        <mat-select [(ngModel)]="status" id="status" placeholder="選擇來源" class="select"
          >
          <mat-option value="待處理">待處理</mat-option>
          <mat-option value="採購處理中">採購處理中</mat-option>
          <mat-option value="派工處理中">派工處理中</mat-option>
          <mat-option value="派工終止">派工終止</mat-option>
          <mat-option value="派工完成">派工完成</mat-option>
          <mat-option value="再派工處理中">再派工處理中</mat-option>
          <mat-option value="再派工終止">再派工終止</mat-option>
          <mat-option value="再派工完成">再派工完成</mat-option>
          <mat-option value="出貨中">出貨中</mat-option>
          <mat-option value="終止">終止</mat-option>
          <mat-option value="完成">完成</mat-option>
        </mat-select>
      </div>
    </div>

    <!-- 訂單日期範圍 -->
    <div class="form-group">
      <label for="orderDateStart">訂單日期範圍</label>
      <div class="date-inputs">
        <input type="date" id="orderDateStart" [(ngModel)]="orderStartDate" placeholder="起始日期">
        <span class="separator">~</span>
        <input type="date" id="orderDateEnd" [(ngModel)]="orderEndDate" placeholder="結束日期">
      </div>
    </div>

    <!-- 預計交期範圍 -->
    <div class="form-group">
      <label for="deliveryDateStart">預計交期範圍</label>
      <div class="date-inputs">
        <input type="date" id="deliveryDateStart" [(ngModel)]="deliveryStartDate" placeholder="起始日期">
        <span class="separator">~</span>
        <input type="date" id="deliveryDateEnd" [(ngModel)]="deliveryEndDate" placeholder="結束日期">
      </div>
    </div>



    <!-- 搜尋按鈕 -->
    <div class="actions">
      <button mat-raised-button color="primary" (click)="search()">搜尋</button>
    </div>
  </div>
</mat-dialog-content>
