<div class="background">
    @if(errorMessage){
    <div class="message">
        {{ errorMessage}}
    </div>
    }
    <div class="container">
        <div class="login-container">
            <div class="login-form-wrapper">
                <h2 class="title">アカウント登録</h2>
                <h3 class="subtitle">②基本情報を入力してください</h3>
                <div class="login-form">
                    <div class="form-group">
                        <input class="input-field" type="text" maxlength="6" placeholder="名前" [(ngModel)]="name">
                        @if(alertMessage){
                        <div class="error-message">
                            名前を入力してください
                        </div>
                        }
                    </div>

                    <div class="form-group">
                        <input class="input-field" type="date" maxlength="20" placeholder="誕生日" [(ngModel)]="birthday">
                        @if(alertMessage1){
                        <div class="error-message">
                            誕生日を入力してください
                        </div>
                        }
                    </div>

                    <div class="form-group">
                        <button class="submit-button" (click)="next()">次へ</button>
                        <button class="submit-button2" (click)="return()">戻る</button>
                        <div class="register-link">
                            <a routerLink="/" routerLinkActive="active">すでにアカウントをお持ちですか？ログインに戻る</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
